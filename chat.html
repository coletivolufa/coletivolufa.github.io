<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Bate-papo · Coletivo Lufã</title>
  <meta name="theme-color" content="#cc2220">
  <link rel="icon" href="assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700&family=Bebas+Neue&family=Literata:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css?v=19">
  <style>
    .chat { max-width: 1040px; margin-right: auto; padding: 18px 14px 56px; font-family: Archivo, Arial, sans-serif; }
    .chat__topo { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 6px 16px; margin-bottom: 12px; }
    .chat__topo h1 { font-family: "Bebas Neue", Impact, sans-serif; font-weight: 400; font-size: 3.2rem; line-height: 1; color: #cc2220; margin: 0; }
    .chat__topo p { margin: 0; font-size: 13px; color: #6b5f55; }
    .chat__entrada { background: #fff4ef; border-left: 4px solid #cc2220; padding: 14px 16px; border-radius: 6px; }

    .chat__app { display: flex; flex-direction: column; height: 72vh; min-height: 460px; background: #EFE6D2; border-radius: 18px; overflow: hidden; box-shadow: 0 8px 24px rgba(60, 40, 20, .12); }
    .chat__lista { flex: 1; overflow-y: auto; padding: 14px clamp(10px, 3vw, 28px); display: flex; flex-direction: column; background-image: radial-gradient(rgba(28, 23, 20, .06) 1px, transparent 1px); background-size: 14px 14px; -webkit-overflow-scrolling: touch; }
    .vazio { margin: auto; color: #6b5f55; text-align: center; }
    .dia { align-self: center; margin: 12px 0 6px; font-size: 12px; color: #5b4f44; background: rgba(255, 255, 255, .75); padding: 4px 12px; border-radius: 999px; }

    .linha { display: flex; align-items: flex-end; gap: 8px; margin-top: 10px; }
    .linha.seguida { margin-top: 2px; }
    .linha.minha { justify-content: flex-end; }
    .foto { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; flex: none; }
    .foto-vazia { width: 34px; flex: none; }
    .balao { max-width: min(80%, 540px); background: #fff; border-radius: 14px 14px 14px 4px; padding: 7px 10px 4px; box-shadow: 0 1px 1px rgba(0, 0, 0, .08); }
    .linha.minha .balao { background: #FBE3D9; border-radius: 14px 14px 4px 14px; }
    .linha.seguida .balao { border-radius: 14px; }
    .linha.minha.seguida .balao { border-radius: 14px; }

    .cab { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; margin-bottom: 2px; }
    .nome { font-weight: 700; font-size: 14px; }
    .selo-ativo { width: 18px; height: 18px; }
    .pill { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; background: #1C1714; color: #fff; padding: 2px 7px; border-radius: 999px; }
    .pill--ativo { background: #cc2220; }
    .texto { margin: 0; font-family: Literata, Georgia, serif; font-size: 16px; line-height: 1.45; word-break: break-word; white-space: pre-wrap; }
    .texto a { color: #cc2220; word-break: break-all; }
    .midia { display: block; max-width: 100%; max-height: 300px; border-radius: 10px; margin-top: 2px; }
    .audio { display: block; width: min(270px, 68vw); height: 40px; margin-top: 2px; }
    .rodape-balao { display: flex; justify-content: flex-end; align-items: center; gap: 8px; font-size: 11px; color: #8a7e72; margin-top: 2px; }
    .apagar { background: none; border: 0; color: #cc2220; font-size: 11px; padding: 0; cursor: pointer; text-decoration: underline; }

    .chat__barra { background: #F7F1E3; padding: 10px; border-top: 1px solid #dccfb6; }
    .comp { display: flex; align-items: center; gap: 8px; }
    .comp[hidden] { display: none; }
    #texto { flex: 1; min-width: 0; min-height: 42px; max-height: 120px; resize: none; border: 0; border-radius: 22px; padding: 11px 16px; font: 16px Literata, Georgia, serif; background: #fff; outline: none; box-shadow: 0 1px 2px rgba(0, 0, 0, .08); }
    .btn { width: 44px; height: 44px; border: 0; border-radius: 50%; background: #fff; color: #1C1714; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex: none; box-shadow: 0 1px 2px rgba(0, 0, 0, .12); }
    .btn svg { width: 22px; height: 22px; }
    .btn--vermelho { background: #cc2220; color: #fff; }
    .btn--gravando { background: #cc2220; color: #fff; }
    .anexar { position: relative; }
    .anexar input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
    .ponto { width: 10px; height: 10px; border-radius: 50%; background: #cc2220; flex: none; animation: pisca 1s steps(2, start) infinite; }
    @keyframes pisca { to { visibility: hidden; } }
    .tempo { font-variant-numeric: tabular-nums; font-weight: 700; min-width: 44px; }
    .espaco { flex: 1; }
    .link { background: none; border: 0; color: #cc2220; font: 700 15px Archivo, sans-serif; cursor: pointer; padding: 10px 6px; }
    #previa-audio { flex: 1; min-width: 0; height: 44px; }
    #aviso-chat { margin: 8px 4px 0; color: #cc2220; font-weight: 700; font-size: 14px; }
    #aviso-chat[hidden], #entrada[hidden], #area[hidden] { display: none; }

    @media (max-width: 560px) {
      .chat__topo h1 { font-size: 2.6rem; }
      .chat__app { height: 74vh; border-radius: 14px; }
      .balao { max-width: 86%; }
    }
  </style>
</head>
<body data-pagina="chat">
<main class="chat">
  <div class="chat__topo">
    <h1>Bate-papo</h1>
    <p>Conversa de todos os membros aprovados · mensagens apagadas 72 horas depois do envio</p>
  </div>

  <div class="chat__entrada" id="entrada" hidden></div>

  <section class="chat__app" id="area" hidden>
    <div class="chat__lista" id="lista" aria-live="polite"></div>

    <div class="chat__barra">
      <div class="comp" id="comp-texto">
        <label class="btn anexar" title="Enviar imagem ou GIF">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="9" cy="10" r="1.7"/><path d="m21 16-5-5-8 8"/></svg>
          <input id="arquivo" type="file" accept="image/png,image/jpeg,image/webp,image/gif" aria-label="Enviar imagem ou GIF">
        </label>
        <textarea id="texto" rows="1" maxlength="500" placeholder="Mensagem" aria-label="Escreva uma mensagem"></textarea>
        <button type="button" class="btn" id="gravar" title="Gravar áudio" aria-label="Gravar áudio" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        </button>
        <button type="button" class="btn btn--vermelho" id="enviar" title="Enviar" aria-label="Enviar">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 11.5 21 3l-8.5 18-2-7.5z"/></svg>
        </button>
      </div>

      <div class="comp" id="comp-gravando" hidden>
        <span class="ponto" aria-hidden="true"></span>
        <span class="tempo" id="tempo">0:00</span>
        <span class="espaco"></span>
        <button type="button" class="link" id="cancelar-gravacao">Cancelar</button>
        <button type="button" class="btn btn--gravando" id="parar-gravacao" title="Parar gravação" aria-label="Parar gravação">
          <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
        </button>
      </div>

      <div class="comp" id="comp-previa" hidden>
        <button type="button" class="link" id="descartar-previa">Descartar</button>
        <audio id="previa-audio" controls preload="auto"></audio>
        <button type="button" class="btn btn--vermelho" id="enviar-previa" title="Enviar áudio" aria-label="Enviar áudio">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 11.5 21 3l-8.5 18-2-7.5z"/></svg>
        </button>
      </div>
    </div>
    <p id="aviso-chat" hidden></p>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script src="assets/comum.js?v=14"></script>
<script src="assets/supa.js?v=6"></script>
<script src="assets/chat.js?v=6"></script>
</body>
</html>
