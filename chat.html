<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Bate-papo · Coletivo Lufã</title>
  <meta name="theme-color" content="#cc2220">
  <link rel="icon" href="assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700&family=Bebas+Neue&family=Literata:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css?v=22">
  <link rel="stylesheet" href="assets/comunidade.css?v=4">
  <style>
    .chat { max-width: 1100px; margin-right: auto; padding: 18px 14px 56px; font-family: Archivo, Arial, sans-serif; }
    .chat__topo { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 6px 16px; margin-bottom: 12px; }
    .chat__topo h1 { font-family: "Bebas Neue", Impact, sans-serif; font-weight: 400; font-size: 3.2rem; line-height: 1; color: #cc2220; margin: 0; }
    .chat__topo p { margin: 0; font-size: 13px; color: #6b5f55; }
    .chat__entrada { background: #fff4ef; border-left: 4px solid #cc2220; padding: 14px 16px; border-radius: 6px; }
    #entrada[hidden], #area[hidden] { display: none; }

    /* comunidade: lateral + painel */
    .comunidade { display: grid; grid-template-columns: 290px 1fr; height: 74vh; min-height: 480px; background: #EFE6D2; border-radius: 18px; overflow: hidden; box-shadow: 0 8px 24px rgba(60, 40, 20, .12); }
    .lateral { background: #F7F1E3; border-right: 1px solid #dccfb6; overflow-y: auto; padding: 12px 10px 20px; }
    .lateral h3 { font-family: "Bebas Neue", Impact, sans-serif; font-weight: 400; font-size: 20px; letter-spacing: .02em; color: #cc2220; margin: 16px 6px 6px; }
    .lateral h3:first-child { margin-top: 4px; }
    .item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 0; background: none; text-align: left; border-radius: 12px; cursor: pointer; font: 15px Archivo, sans-serif; color: #1C1714; }
    .item:hover { background: #fff; }
    .item.ativo { background: #fff; box-shadow: inset 3px 0 0 #cc2220; }
    .item img, .chat-membro img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; flex: none; }
    .item__geral { width: 32px; height: 32px; border-radius: 50%; background: #cc2220; color: #fff; display: inline-flex; align-items: center; justify-content: center; flex: none; }
    .item__geral svg { width: 18px; height: 18px; }
    .contador { margin-left: auto; background: #cc2220; color: #fff; border-radius: 999px; font-size: 11px; font-weight: 700; padding: 2px 7px; }
    .muted { font-size: 13px; color: #8a7e72; margin: 4px 8px; }
    .convite { display: flex; flex-direction: column; gap: 6px; background: #fff; border-radius: 12px; padding: 9px 10px; margin: 4px 0; font-size: 14px; }
    .acoes { display: flex; gap: 6px; }
    .chat-membro { display: flex; align-items: center; gap: 9px; padding: 6px 8px; border-radius: 12px; }
    .chat-membro:hover { background: #fff; }
    .chat-membro__nome { font-size: 14px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .busca { width: 100%; padding: 9px 12px; border: 0; border-radius: 999px; background: #fff; font: 14px Archivo, sans-serif; margin-bottom: 6px; box-shadow: 0 1px 2px rgba(0, 0, 0, .08); }
    .btn-mini { font: 700 12px Archivo, sans-serif; background: #1C1714; color: #fff; border: 0; padding: 6px 10px; border-radius: 999px; cursor: pointer; flex: none; }
    .btn-mini--ok { background: #cc2220; }

    .chat-painel { display: flex; flex-direction: column; min-width: 0; background: #EFE6D2; }
    .chat-painel__cab { display: flex; align-items: baseline; gap: 12px; padding: 12px 18px; background: #fff; border-bottom: 1px solid #dccfb6; }
    .chat-painel__cab strong { font-family: "Bebas Neue", Impact, sans-serif; font-weight: 400; font-size: 28px; line-height: 1; color: #cc2220; }
    .chat-painel__cab span { font-size: 13px; color: #6b5f55; }
    .chat__lista { flex: 1; overflow-y: auto; padding: 14px clamp(10px, 2.5vw, 26px); display: flex; flex-direction: column; background-image: radial-gradient(rgba(28, 23, 20, .06) 1px, transparent 1px); background-size: 14px 14px; -webkit-overflow-scrolling: touch; }
    .chat-vazio { margin: auto; color: #6b5f55; text-align: center; }
    .dia { align-self: center; margin: 12px 0 6px; font-size: 12px; color: #5b4f44; background: rgba(255, 255, 255, .75); padding: 4px 12px; border-radius: 999px; }
    .msg-linha { display: flex; align-items: flex-end; gap: 8px; margin-top: 10px; }
    .msg-linha.seguida { margin-top: 2px; }
    .msg-linha.minha { justify-content: flex-end; }
    .msg-foto { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; flex: none; }
    .msg-foto-vazia { width: 34px; flex: none; }
    .balao { max-width: min(80%, 540px); background: #fff; border-radius: 14px 14px 14px 4px; padding: 7px 10px 4px; box-shadow: 0 1px 1px rgba(0, 0, 0, .08); }
    .msg-linha.minha .balao { background: #FBE3D9; border-radius: 14px 14px 4px 14px; }
    .msg-linha.seguida .balao { border-radius: 14px; }
    .cab { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; margin-bottom: 2px; }
    .nome { font-weight: 700; font-size: 14px; }
    .selo-ativo { width: 18px; height: 18px; }
    .pill { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; background: #1C1714; color: #fff; padding: 2px 7px; border-radius: 999px; }
    .pill--ativo { background: #cc2220; }
    .msg-texto { margin: 0; font-family: Literata, Georgia, serif; font-size: 16px; line-height: 1.45; word-break: break-word; white-space: pre-wrap; }
    .msg-texto a { color: #cc2220; word-break: break-all; }
    .midia { display: block; max-width: 100%; max-height: 300px; border-radius: 10px; margin-top: 2px; }
    .audio { display: block; width: min(270px, 68vw); height: 40px; margin-top: 2px; }
    .rodape-balao { display: flex; justify-content: flex-end; align-items: center; gap: 8px; font-size: 11px; color: #8a7e72; margin-top: 2px; }
    .apagar { background: none; border: 0; color: #cc2220; font-size: 11px; padding: 0; cursor: pointer; text-decoration: underline; }

    .adicionar { display: flex; gap: 6px; margin: 2px 6px 8px; }
    .adicionar input { flex: 1; min-width: 0; padding: 8px 12px; border: 0; border-radius: 999px; background: #fff; font: 14px Archivo, sans-serif; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
    .item__txt { display: flex; flex-direction: column; min-width: 0; flex: 1; }
    .sub-item { font-size: 12px; color: #8a7e72; font-weight: 400; }
    .coracao-match { color: #cc2220; margin-right: 4px; }
    .chat-membro__nome { display: flex; flex-direction: column; flex: 1; min-width: 0; font-size: 14px; }
    .digitando { padding: 6px 18px 0; font-size: 13px; font-style: italic; color: #5b4f44; background: #F7F1E3; }
    .digitando[hidden] { display: none; }
    .chat__barra { background: #F7F1E3; padding: 10px; border-top: 1px solid #dccfb6; }
    .comp { display: flex; align-items: center; gap: 8px; }
    .comp[hidden] { display: none; }
    #texto { flex: 1; min-width: 0; min-height: 42px; max-height: 120px; resize: none; border: 0; border-radius: 22px; padding: 11px 16px; font: 16px Literata, Georgia, serif; background: #fff; outline: none; box-shadow: 0 1px 2px rgba(0, 0, 0, .08); }
    .btn { width: 44px; height: 44px; border: 0; border-radius: 50%; background: #fff; color: #1C1714; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex: none; box-shadow: 0 1px 2px rgba(0, 0, 0, .12); }
    .btn svg { width: 22px; height: 22px; }
    .btn--vermelho, .btn--gravando { background: #cc2220; color: #fff; }
    .anexar { position: relative; }
    .anexar input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
    .ponto { width: 10px; height: 10px; border-radius: 50%; background: #cc2220; flex: none; animation: pisca 1s steps(2, start) infinite; }
    @keyframes pisca { to { visibility: hidden; } }
    .tempo { font-variant-numeric: tabular-nums; font-weight: 700; min-width: 44px; }
    .espaco { flex: 1; }
    .chat-link { background: none; border: 0; color: #cc2220; font: 700 15px Archivo, sans-serif; cursor: pointer; padding: 10px 6px; }
    #previa-audio { flex: 1; min-width: 0; height: 44px; }
    #aviso-chat { margin: 0; padding: 6px 18px 0; color: #cc2220; font-weight: 700; font-size: 14px; background: #F7F1E3; }
    #aviso-chat[hidden] { display: none; }

    @media (max-width: 760px) {
      .chat__topo h1 { font-size: 2.6rem; }
      .comunidade { grid-template-columns: 1fr; height: auto; min-height: 0; border-radius: 14px; }
      .lateral { max-height: 260px; border-right: 0; border-bottom: 1px solid #dccfb6; }
      .chat-painel { height: 72vh; }
      .balao { max-width: 86%; }
    }
  </style>
</head>
<body data-pagina="chat">
<main class="chat">
  <div class="chat__topo">
    <h1>Bate-papo</h1>
    <p>Conversa de todos os membros aprovados · tudo some 72 horas depois do envio</p>
  </div>

  <div class="chat__entrada" id="entrada" hidden></div>

  <section class="comunidade" id="area" hidden>
    <aside class="lateral" id="lateral">
      <button type="button" class="item ativo" id="btn-geral">
        <span class="item__geral"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M4 4h16v12H9l-5 4z"/></svg></span>
        <span>Chat geral</span>
      </button>

      <h3>Conversas</h3>
      <div id="lista-conversas"></div>

    </aside>

    <div class="chat-painel">
      <header class="chat-painel__cab"><strong id="titulo-painel">Chat geral</strong><span id="sub-painel">Todos os membros aprovados</span></header>
      <div class="chat__lista" id="lista" aria-live="polite"></div>
      <div class="digitando" id="digitando" aria-live="polite" hidden></div>

      <div class="resposta-bar" id="resposta-bar" hidden>
        <span id="resposta-texto"></span>
        <button type="button" class="chat-link" id="cancelar-resposta" aria-label="Cancelar resposta">✕</button>
      </div>
      <div class="chat__barra">
        <div class="comp" id="comp-texto">
          <label class="btn anexar" title="Enviar imagem ou GIF">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="9" cy="10" r="1.7"/><path d="m21 16-5-5-8 8"/></svg>
            <input id="arquivo" type="file" accept="image/png,image/jpeg,image/webp,image/gif" aria-label="Enviar imagem ou GIF">
          </label>
          <textarea id="texto" rows="1" maxlength="500" placeholder="Mensagem" aria-label="Escreva uma mensagem"></textarea>
          <button type="button" class="btn" id="gravar" title="Gravar áudio" aria-label="Gravar áudio" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
          </button>
          <button type="button" class="btn btn--vermelho" id="enviar" title="Enviar" aria-label="Enviar">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 11.5 21 3l-8.5 18-2-7.5z"/></svg>
          </button>
        </div>

        <div class="comp" id="comp-gravando" hidden>
          <span class="ponto" aria-hidden="true"></span>
          <span class="tempo" id="tempo">0:00</span>
          <span class="espaco"></span>
          <button type="button" class="chat-link" id="cancelar-gravacao">Cancelar</button>
          <button type="button" class="btn btn--gravando" id="parar-gravacao" title="Parar gravação" aria-label="Parar gravação">
            <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
          </button>
        </div>

        <div class="comp" id="comp-previa" hidden>
          <button type="button" class="chat-link" id="descartar-previa">Descartar</button>
          <audio id="previa-audio" controls preload="auto"></audio>
          <button type="button" class="btn btn--vermelho" id="enviar-previa" title="Enviar áudio" aria-label="Enviar áudio">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 11.5 21 3l-8.5 18-2-7.5z"/></svg>
          </button>
        </div>
      </div>
      <p id="aviso-chat" hidden></p>
    </div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script src="assets/comum.js?v=15"></script>
<script src="assets/supa.js?v=6"></script>
<script src="assets/comunidade.js?v=3"></script>
<script src="assets/avisos.js?v=1"></script>
<script src="assets/chat.js?v=11"></script>
</body>
</html>
