<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Feed · Coletivo Lufã</title>
  <meta name="theme-color" content="#cc2220">
  <link rel="icon" href="assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700&family=Bebas+Neue&family=Literata:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css?v=21">
  <link rel="stylesheet" href="assets/comunidade.css?v=4">
</head>
<body data-pagina="feed">
<main class="com">
  <header class="com__topo">
    <h1>Feed</h1>
    <p>Publique fotos e vídeos, use hashtags e descubra o que está em alta.</p>
  </header>

  <div class="estado" id="estado" hidden></div>

  <div id="conteudo" hidden>
    <section class="card tendencias">
      <h2 class="titulo-bloco">Em alta agora</h2>
      <ol class="lista-tendencias" id="tendencias"></ol>
    </section>

    <section class="card compor">
      <div class="compor__topo">
        <img class="av" id="minha-foto" src="assets/img/avatar.svg" alt="">
        <div style="flex:1; min-width:0">
          <strong id="meu-apelido"></strong>
          <button type="button" class="btn-pequeno btn-pequeno--link" id="trocar-apelido">trocar @arroba</button>
          <button type="button" class="btn-pequeno btn-pequeno--link" id="editar-dados">meus dados</button>
          <span class="muted" style="display:block">Escreva, use # para criar hashtags, e anexe uma foto ou um vídeo</span>
        </div>
      </div>
      <form id="form-apelido" class="form-apelido" hidden>
        <label for="novo-apelido" class="muted">Novo @arroba (letras minúsculas, números, ponto ou traço baixo)</label>
        <div class="form-apelido__linha">
          <span class="arroba">@</span>
          <input id="novo-apelido" maxlength="20" autocomplete="off">
          <button class="btn-pequeno" type="submit">Salvar</button>
          <button class="btn-pequeno btn-pequeno--suave" type="button" id="cancelar-apelido">Cancelar</button>
        </div>
        <p class="aviso-com" id="apelido-aviso" hidden></p>
      </form>
      <form id="form-dados" class="form-apelido" hidden>
        <p class="muted" style="margin:0 0 8px">Esses dados ajudam todo mundo a se conhecer. Todos são opcionais.</p>
        <div id="campos-dados"></div>
        <div class="form-apelido__linha">
          <button class="btn-pequeno" type="submit">Salvar dados</button>
          <button class="btn-pequeno btn-pequeno--suave" type="button" id="cancelar-dados">Cancelar</button>
        </div>
        <p class="aviso-com" id="dados-aviso" hidden></p>
      </form>
      <form id="form-post">
        <textarea id="post-texto" maxlength="500" placeholder="No que você está pensando? Ex.: #lutadeclasses" aria-label="Escreva uma publicação"></textarea>
        <div class="previa-midia" id="post-previa" hidden>
          <img id="post-previa-img" alt="Prévia da foto" hidden>
          <video id="post-previa-video" controls playsinline hidden></video>
          <button type="button" class="tirar" id="post-tirar">Remover</button>
        </div>
        <div class="compor__acoes">
          <label class="btn-foto">Foto ou vídeo
            <input type="file" id="post-foto" accept="image/png,image/jpeg,image/webp,image/gif,video/mp4,video/webm,video/quicktime" aria-label="Escolher foto ou vídeo">
          </label>
          <span class="espaco"></span>
          <span class="muted" id="post-contador">0/500</span>
          <button class="botao-com" type="submit" id="post-publicar">Publicar</button>
        </div>
      </form>
      <p class="aviso-com" id="post-aviso" hidden></p>
    </section>

    <div class="filtro-ativo" id="filtro-ativo" hidden>
      <span id="filtro-texto"></span>
      <button type="button" class="btn-pequeno btn-pequeno--link" id="limpar-filtro">ver tudo</button>
    </div>

    <div id="feed" aria-live="polite"></div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script src="assets/comum.js?v=15"></script>
<script src="assets/supa.js?v=6"></script>
<script src="assets/comunidade.js?v=3"></script>
<script src="assets/avisos.js?v=1"></script>
<script src="assets/feed.js?v=5"></script>
</body>
</html>
