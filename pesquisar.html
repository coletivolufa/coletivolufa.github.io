<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Pesquisar · Coletivo Lufã</title>
  <meta name="theme-color" content="#cc2220">
  <link rel="icon" href="assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700&family=Bebas+Neue&family=Literata:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css?v=25">
  <link rel="stylesheet" href="assets/comunidade.css?v=4">
</head>
<body data-pagina="pesquisar">
<main class="com">
  <header class="com__topo">
    <h1>Pesquisar</h1>
    <p>Encontre uma pessoa pelo @arroba e peça amizade.</p>
  </header>

  <div class="estado" id="estado" hidden></div>

  <div id="conteudo" hidden>
    <section class="card">
      <div class="campo-com" style="margin-bottom:0">
        <label for="busca">@arroba</label>
        <input id="busca" placeholder="Digite o @arroba da pessoa" maxlength="22" autocomplete="off" autofocus>
      </div>
    </section>
    <div id="resultados"></div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script src="assets/comum.js?v=16"></script>
<script src="assets/supa.js?v=6"></script>
<script src="assets/comunidade.js?v=3"></script>
<script src="assets/avisos.js?v=1"></script>
<script src="assets/pesquisar.js?v=1"></script>
</body>
</html>
