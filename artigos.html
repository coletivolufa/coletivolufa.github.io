<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diretório de Publicações Laura Brandão · Coletivo Lufã</title>
  <meta name="description" content="Artigos do Coletivo Lufã: formação marxista, análise de conjuntura e crítica ao capitalismo.">
  <meta property="og:title" content="Diretório de Publicações Laura Brandão · Coletivo Lufã">
  <meta property="og:image" content="assets/img/compartilhar.jpg">
  <meta name="theme-color" content="#cc2220">
  <link rel="icon" href="assets/img/favicon.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700&family=Bebas+Neue&family=Literata:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css?v=57">
</head>
<body data-pagina="artigos">
<main>
  <header class="cat-capa cat-capa--laura" id="cabecalho">
    <div class="cat-capa__mari" aria-hidden="true"></div>
    <img class="cat-capa__retrato" src="assets/img/laura-silhueta.png" alt="Ilustração em preto e branco de Laura Brandão" width="760" height="893">
    <div class="cat-capa__texto">
      <h1 class="cat-capa__nome"><span class="cat-capa__centro">Diretório de Publicações</span> <span class="cat-capa__carlos">Laura Brandão</span></h1>
    </div>
  </header>
  <section class="art-jornal" id="faixa-jornal">
    <a class="art-jornal__botao" href="jornal.html">
      <span class="art-jornal__chamada">★ Conheça o Jornal da Classe Trabalhadora</span>
      <span class="art-jornal__sub">Inspirado no jornal <i>A Classe Operária</i>, uma homenagem à redatora e poetisa comunista Laura Brandão</span>
      <span class="art-jornal__seta" aria-hidden="true">→</span>
    </a>
  </section>

  <section class="secao">
    <div class="conteudo" id="area" aria-live="polite">
      <p>Carregando…</p>
    </div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script src="assets/comum.js?v=20"></script>
<script src="assets/supa.js?v=8"></script>
<script>
  const area = document.getElementById("area");
  const slug = new URLSearchParams(location.search).get("a");

  async function mostrarLista() {
    try {
      const [doArquivo, doBanco] = await Promise.all([lerJSON("data/artigos.json").catch(() => []), artigosDoBanco()]);
      const artigos = [...doBanco, ...doArquivo.filter((a) => !doBanco.some((b) => b.slug === a.slug))].sort((a, b) => (b.data || "").localeCompare(a.data || ""));
      if (!artigos.length) {
        area.innerHTML = '<div class="vazio">Nenhum artigo publicado ainda. Volte em breve.</div>';
        return;
      }
      area.innerHTML = '<div class="lista-artigos">' + artigos.map((a) => `
        <a class="cartao-artigo" href="artigos.html?a=${encodeURIComponent(a.slug)}">
          <h2>${esc(a.titulo)}</h2>
          <div class="meta">Por <strong>${esc(a.autor)}</strong> · ${esc(dataPorExtenso(a.data))}</div>
          <p>${esc(a.resumo || "")}</p>
          <span class="ler">Ler artigo →</span>
        </a>`).join("") + "</div>";
    } catch (e) {
      area.innerHTML = '<div class="vazio">Não foi possível carregar os artigos agora.</div>';
    }
  }

  async function mostrarArtigo() {
    document.getElementById("cabecalho").hidden = true;
    document.getElementById("faixa-jornal").hidden = true;
    try {
      let a = await lerJSON("artigos/" + encodeURIComponent(slug) + ".json").catch(() => null);
      if (!a) a = (await artigosDoBanco()).find((x) => x.slug === slug);
      if (!a) throw new Error("não encontrado");
      document.title = a.titulo + " · Coletivo Lufã";
      area.innerHTML = `
        <article class="artigo">
          <a class="artigo__voltar" href="artigos.html">← Todos os artigos</a>
          <h1>${esc(a.titulo)}</h1>
          <div class="meta">Por <strong>${esc(a.autor)}</strong> · ${esc(dataPorExtenso(a.data))}</div>
          <div class="texto-artigo">${markdown(a.texto)}</div>
          ${fontesHTML(a.fontes)}
        </article>`;
      window.scrollTo(0, 0);
    } catch (e) {
      area.innerHTML = `<div class="artigo"><a class="artigo__voltar" href="artigos.html">← Todos os artigos</a>
        <div class="vazio" style="margin-top:24px">Artigo não encontrado. Se ele acabou de ser publicado, espere um ou dois minutos e recarregue a página.</div></div>`;
    }
  }

  slug ? mostrarArtigo() : mostrarLista();
</script>
</body>
</html>
